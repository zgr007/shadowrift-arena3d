<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 512px; height: 512px; overflow: hidden; }
  body {
    background:
      radial-gradient(circle at 50% 42%, rgba(74,168,255,0.22), transparent 46%),
      radial-gradient(circle at 50% 50%, #12202a 0%, #070c10 62%, #04070a 100%);
    display: grid; place-items: center;
    font-family: "Microsoft YaHei", serif;
  }
  .diamond {
    position: absolute; width: 336px; height: 336px;
    border: 3px solid rgba(232,195,122,0.75);
    transform: rotate(45deg);
    box-shadow: 0 0 42px rgba(232,195,122,0.22), inset 0 0 42px rgba(232,195,122,0.1);
  }
  .diamond::after {
    content: ''; position: absolute; inset: 22px;
    border: 1px solid rgba(232,195,122,0.3);
  }
  .char {
    position: relative; z-index: 2;
    font-size: 172px; font-weight: 800; color: #f4dcab;
    text-shadow: 0 0 34px rgba(232,195,122,0.55), 0 8px 26px rgba(0,0,0,0.8);
    transform: translateY(-14px);
  }
  .crystal {
    position: absolute; width: 58px; height: 88px; bottom: 82px;
    background: linear-gradient(180deg, #eaf9ff, #6fc9ff 38%, #2f86cf);
    clip-path: polygon(50% 0, 100% 34%, 76% 100%, 24% 100%, 0 34%);
    filter: drop-shadow(0 0 22px rgba(90,200,255,0.8));
    transform: rotate(45deg);
  }
  .sub {
    position: absolute; bottom: 30px; z-index: 2;
    font-size: 13px; letter-spacing: 9px; padding-left: 9px;
    color: rgba(232,195,122,0.55);
  }
</style>
</head>
<body>
  <div class="diamond"></div>
  <div class="char">孤</div>
  <div class="crystal"></div>
  <div class="sub">SHADOWRIFT</div>
</body>
</html>
